---
deployment:
  tasks:
    - export DEPLOYPATH=/home/imperial/public_html

    # Usa só /bin/cp, que existe em qualquer servidor.
    # A versao anterior usava /usr/bin/rsync e falhava calada
    # porque esse caminho nao existe nesta hospedagem.

    # Paginas e arquivos de raiz
    - /bin/cp -f index.html $DEPLOYPATH/
    - /bin/cp -f quem-somos.html historia.html empreendimentos.html $DEPLOYPATH/
    - /bin/cp -f portfolio.html acompanhamento-de-obras.html $DEPLOYPATH/
    - /bin/cp -f trabalhe-conosco.html contato.html $DEPLOYPATH/
    - /bin/cp -f impulsi-the-one.html impulsi-interlagos.html omni-espelho-dagua.html $DEPLOYPATH/
    - /bin/cp -f site.webmanifest $DEPLOYPATH/
    - /bin/cp -f .htaccess $DEPLOYPATH/

    # Assets. O "assets/." copia o CONTEUDO da pasta;
    # sem o ponto viraria public_html/assets/assets.
    - /bin/mkdir -p $DEPLOYPATH/assets
    - /bin/cp -Rf assets/. $DEPLOYPATH/assets/

    # Marcador de diagnostico: se este arquivo existir mas as
    # paginas nao, o problema esta nas tarefas de copia acima,
    # nao no deploy em si.
    - /bin/date > /home/imperial/ultimo-deploy.txt
